<app-breadcrumbs [items]="breadcrumbs">
    <div page-help>
        <p i18n>
            This page displays a list of the most recent events performed by Stork. There are three event urgency
            levels: info, warning, and error.
        </p>
        <p i18n>Each event in the list includes links to more information about the affected daemon or machine.</p>
    </div>
</app-breadcrumbs>

<div style="margin-top: 20px">
    <app-events-panel
        #eventsTable
        ui="table"
        [filter]="{ level: 0, machineId: machineId, daemonName: daemonName, userId: userId }"
    ></app-events-panel>
</div>
