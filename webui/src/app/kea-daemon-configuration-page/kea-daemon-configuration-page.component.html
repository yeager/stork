<app-breadcrumbs [items]="breadcrumbs">
    <div page-help>
        <p>This page displays a raw configuration for the Kea daemon.</p>
    </div>
</app-breadcrumbs>

<p-panel styleClass="max-w-100rem">
    <ng-template #header>
        <div class="flex flex-wrap gap-2 w-full justify-content-end">
            <!-- Title -->
            <span class="panel-header__title flex-auto font-semibold">JSON</span>

            <!-- Collapse/expand button -->
            @if (autoExpand === 'none') {
                <p-button
                    class="flex-none"
                    icon="fa fa-expand-alt"
                    i18n-label label="Expand"
                    (click)="onClickToggleNodes()"
                    [disabled]="configuration === null"
                ></p-button>
            }
            @if (autoExpand === 'all') {
                <p-button
                    class="flex-none"
                    icon="fa fa-compress-alt"
                    i18n-label label="Collapse"
                    (click)="onClickToggleNodes()"
                    [disabled]="configuration === null"
                ></p-button>
            }

            <!-- Refresh button -->
            <p-button
                class="flex-none"
                icon="fa fa-sync"
                i18n-label label="Refresh"
                (click)="onClickRefresh()"
                [disabled]="configuration === null && !failedFetch"
            ></p-button>

            <!-- Download button -->
            <a class="flex-none" [download]="downloadFilename" [href]="'/api/daemons/' + daemonId + '/config'">
                <p-button icon="fa fa-download" i18n-label label="Download" [disabled]="configuration === null"></p-button>
            </a>
        </div>
    </ng-template>

    <!-- JSON viewer -->
    @if (!failedFetch) {
        <app-json-tree-root [value]="configuration" [autoExpand]="autoExpand"></app-json-tree-root>
    } @else {
        <p-message severity="warn" i18n-text text="Fetching daemon configuration failed"></p-message>
    }
</p-panel>
