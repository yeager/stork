@if (hasValidValue) {
    <span pTooltip="{{ value | localNumber }}">{{ value | humanCount }}</span>
}
@if (hasInvalidValue) {
    <span pTooltip="Invalid value" i18n-pTooltip="@@value.invalid">{{ value }}</span>
}
@if (!hasValue) {
    <span pTooltip="No value" i18n-pTooltip="@@value.none">-</span>
}
